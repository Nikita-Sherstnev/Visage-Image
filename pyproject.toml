[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "visage-image"
version = "1.0.1"
description = "A 256px text-to-image model for face generation: single-stream rectified-flow DiT over an f16x96 VAE latent."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.9",
    "torchvision",
    "transformers>=4.56",
    "huggingface-hub",
    "safetensors",
    "pillow",
]

[project.urls]
Repository = "https://github.com/Nikita-Sherstnev/Visage-Image"
Weights = "https://huggingface.co/Sherstnev/Visage-Image"
Prompting = "https://github.com/Nikita-Sherstnev/Visage-Image/blob/main/PROMPTING.md"

[project.optional-dependencies]
train = [
    "pyyaml",
    "timm",          # DINOv2 alignment
    "torchmetrics",  # LPIPS
]
data = [
    "opencv-python",
    "ultralytics",  # YOLO face detector for scripts/crop_faces.py
]
dev = ["ruff"]

[tool.setuptools]
packages = ["visage"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear, simplify, comprehensions
select = ["F", "E", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["visage"]
